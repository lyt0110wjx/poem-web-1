    .custom-picker{ margin-bottom:14px; border:1px solid #d4c09a; border-radius:8px; background:#fffbf2; }

    .msg-user{ align-items:flex-end; }
    .poet-tag{

    .msg-item span{ display:inline-block; max-width:72%; padding:11px 16px; border-radius:12px; white-space:pre-line; }

    .msg-user span{
        background: linear-gradient(180deg, #3a3226, #2c251b); color:#f7e9c8;
        border-radius:12px 12px 2px 12px; box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }
    .input-area{ display:flex; gap:14px; }
    #userInput{

    }

    #sendBtn{
        padding:0 32px; background: linear-gradient(180deg, #a83c2b, #8c2e20); color:#f9e0b7;
        border:none; border-radius:10px; cursor:pointer; font-size:16px; letter-spacing:1px;
        box-shadow:0 2px 6px rgba(154,52,39,0.25);
    }
    .tip{ text-align:center; margin-top:12px; font-size:14px; color:#8a7d66; letter-spacing:1px; }
    .panel{ display:none; }
    .panel.active{ display:block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
    @media (max-width: 900px){
        .wrap{flex-direction:column;height:auto;}
        .left-box{width:100%;}
        body::after{display:none;}
    }

    /* ========== 搜索弹窗样式 ========== */
    .search-mask{
        position:fixed; top:0; left:0; width:100%; height:100%;
        background:rgba(0,0,0,0.55); z-index:9999; display:none; align-items:center; justify-content:center;

    .search-dialog{
        width:620px; background:#f8f3e8; border-radius:14px; padding:36px;

    .search-input{

    }
    .search-input:focus{ border-color:#b89b6b; box-shadow:0 0 0 3px rgba(184,155,107,0.22); }
    .search-tip-err{ color:#a83838; font-size:15px; margin-top:10px; min-height:20px; }
    .suggest-panel{
        position:absolute; left:36px; right:36px; top:170px;
        background:#fffbf4; border:2px solid #9c7d54; border-top:0;

    .suggest-item{ display:flex; align-items:center; padding:13px 18px; font-size:16px; color:#5c3f24; cursor:pointer; gap:12px; }

    .search-btn-group{ display:flex; justify-content:flex-end; gap:18px; margin-top:28px; }
    .confirm-btn{ width:106px; height:46px; background:#8c6b44; color:#fff; border:none; border-radius:8px; font-size:17px; cursor:pointer; letter-spacing:1px; }
    .cancel-btn{ width:106px; height:46px; background:#d9c9b3; color:#443322; border:none; border-radius:8px; font-size:17px; cursor:pointer; letter-spacing:1px; }

    .cancel-btn:hover{ background:#c9b89f; }
</style>

let currentMode = "chat";
let currentChatPoet = null;
let chatModeHistory = [];
let meetingGuests = [];

const MAX_GUESTS = 6;

function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

function addSysMsg(text, historyArr){
    const div = document.createElement("div");
    div.className = "msg-item msg-ai";
    div.innerHTML = `<span style="background:#e9d7b8; border:none; text-align:center; font-size:14px; color:#665944;">${text}</span>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    historyArr.push({role:"assistant", content: text});
}
function addTempMsg(text){
    const div = document.createElement("div");
    div.className = "msg-item msg-ai temp-msg";
    div.innerHTML = `<span style="background:#eee3cf; color:#887d66; font-size:14px;">${text}</span>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
function removeLastMsg(){ const last = chatBox.lastChild; if(last) chatBox.removeChild(last); }
function addPoetMsg(poet, text, historyArr){
    const div = document.createElement("div");
    div.className = "msg-item msg-ai";
    div.innerHTML = `<span class="poet-tag">【${poet.dynasty}·${poet.name}】</span><span>${text}</span>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    historyArr.push({role:"assistant", name: poet.name, content: text});
}
function addUserMsg(text, historyArr){
    const div = document.createElement("div");
    div.className = "msg-item msg-user";
    div.innerHTML = `<span class="poet-tag">你</span><span>${text}</span>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    historyArr.push({role:"user", content: text});
}

// 【核心修改：调用真实的 AI 后端】
async function poetSpeak(poet, historyArr){
    addTempMsg(`${poet.name}正凝神思索...`);
    
    // 构造发给 AI 的提示词
    let prompt = `你现在扮演中国古代著名诗人【${poet.dynasty}·${poet.name}】。请以该诗人的身份、口吻、性格和文学素养来回答用户。语言要符合古风，尽量有文采。\n\n`;
    
    if (currentMode === "meeting") {
        prompt += `当前你们正在参加一场文人雅集（诗会），本次讨论的主题是：「${currentTopic}」。请针对这个主题，发表你作为${poet.name}的见解，字数控制在100字以内，言简意赅。\n`;
    } else {
        prompt += `用户正在与你单独交谈。\n`;
    }
    
    // 把历史对话拼进去，让 AI 有上下文记忆
    let conversationContext = "";
    historyArr.forEach(msg => {
        if (msg.role === "user") conversationContext += `【用户】: ${msg.content}\n`;
        else if (msg.role === "assistant" && msg.name === poet.name) conversationContext += `【${poet.name}】: ${msg.content}\n`;
    });
    
    prompt += conversationContext;

    try {
        // 请求你的本地后端服务器
        const res = await fetch("http://localhost:3000/api/generate-poem", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: prompt })
        });
        
        if (!res.ok) throw new Error("本地后端请求失败");
        const json = await res.json();
        
        removeLastMsg();
        addPoetMsg(poet, json.content, historyArr);
    } catch(e) {
        console.error("AI 响应失败：", e);
        removeLastMsg();
        // 如果后端没开或者报错，给一个兜底的优雅回复
        addPoetMsg(poet, "（微叹）老夫此刻偶感风寒，才思滞涩，容我稍作歇息再与君论道……", historyArr);
    }
}

tabBtns.forEach(btn => {
    btn.onclick = function(){
        const targetTab = this.dataset.tab;
        if(targetTab === currentMode) return;
        currentMode = targetTab;
        tabBtns.forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        if(targetTab === "chat"){
            chatPanel.classList.add("active");
            meetingPanel.classList.remove("active");
            meetingBanner.innerText = "--- 一对一模式：选好诗人，即可开始聊天 ---";
            chatBox.innerHTML = "";
            addSysMsg("欢迎回到一对一对谈。请在左侧选一位你想交流的诗人，即可开启文雅的跨时空对话。", chatModeHistory);
        }else{
            chatPanel.classList.remove("active");
            meetingPanel.classList.add("active");
            meetingBanner.innerText = "--- 雅集诗会，以待嘉宾 ---";
            chatBox.innerHTML = "";
            addSysMsg("欢迎来到同台诗会。在左侧输入讨论话题，邀请嘉宾，即可观摩历代文人雅士的文雅论道。", meetingModeHistory);
        }
        userInput.value = "";
    }
})

function initChatMode(){
    dynastSel.onchange = function(){
        const d = this.value;
        poetSel.innerHTML = `<option value="">--选择诗人--</option>`;
        poetInfoDom.innerText = "";
        currentChatPoet = null;
        chatModeHistory = [];
        chatBox.innerHTML = "";
        addSysMsg("已切换朝代，请选择你想要交流的诗人。", chatModeHistory);
        if(!d){
            poetAllPool.forEach(poet => {
                const opt = document.createElement("option");
                opt.value = poet.name;
                opt.innerText = `${poet.name}（${poet.dynasty}）`;
                opt.dataset.poet = JSON.stringify(poet);
                poetSel.appendChild(opt);
            })
            return;
        }
        poetAllPool.filter(p => p.dynasty === d).forEach(poet => {
            const opt = document.createElement("option");
            opt.value = poet.name;
            opt.innerText = poet.name;
            opt.dataset.poet = JSON.stringify(poet);
            poetSel.appendChild(opt);
        })
    }
    
    poetSel.onchange = function(){
        const selectedOpt = this.options[this.selectedIndex];
        if(!selectedOpt.value){
            currentChatPoet = null;
            poetInfoDom.innerText = "";
            return;
        }
        currentChatPoet = JSON.parse(selectedOpt.dataset.poet);
        poetInfoDom.innerText = `${currentChatPoet.name} · ${currentChatPoet.dynasty}`;
        chatModeHistory = [];
        chatBox.innerHTML = "";
        addSysMsg(`你好，我是${currentChatPoet.name}。今日雅集相会，不知先生有何见教？`, chatModeHistory);
    }
}

function initMeetingMode(){
    const dynastyGroups = {};
    poetAllPool.forEach(poet => {
        if(!dynastyGroups[poet.dynasty]) dynastyGroups[poet.dynasty] = [];
        dynastyGroups[poet.dynasty].push(poet);
    })
    Object.keys(dynastyGroups).forEach(dynasty => {
        const groupDiv = document.createElement("div");
        groupDiv.className = "dynasty-group";
        groupDiv.innerHTML = `<h5>${dynasty}（共${dynastyGroups[dynasty].length}位）</h5>`;
        dynastyGroups[dynasty].forEach(poet => {
            const checkDiv = document.createElement("label");
            checkDiv.className = "check-item";
            checkDiv.innerHTML = `<input type="checkbox" value="${poet.name}" data-dynasty="${poet.dynasty}"> ${poet.name}`;
            checkDiv.querySelector("input").onchange = function(){
                specialGuests = [];
                const checked = document.querySelectorAll("input:checked");
                if(checked.length > MAX_GUESTS){
                    alert(`最多只能选${MAX_GUESTS}位特邀诗人哦`);
                    checked[checked.length -1].checked = false;
                    return;
                }
                checked.forEach(cb => {
                    const poetName = cb.value;
                    const poetDynasty = cb.dataset.dynasty;
                    const poet = poetAllPool.find(p => p.name === poetName && p.dynasty === poetDynasty);
                    specialGuests.push(poet);
                })
            }
            groupDiv.appendChild(checkDiv);
        })
        pickerContent.appendChild(groupDiv);
    })
    
    inviteBtn.onclick = function(){
        if(isMeetingRunning){alert("诗会正在进行中");return;}
        meetingGuests = [];
        specialGuests.forEach(poet => {
            meetingGuests.push({...poet, tag: "tag-special", tagName:"特邀"});
        })
        const remainCount = MAX_GUESTS - meetingGuests.length;
        if(remainCount >0){
            const usedNames = meetingGuests.map(p => p.name);
            const pool = poetAllPool.filter(p => !usedNames.includes(p.name));
            const shuffled = [...pool].sort(() => Math.random() - 0.5);
            for(let i=0; i<remainCount; i++){
                if(!shuffled[i]) break;
                meetingGuests.push({...shuffled[i], tag:"tag-random", tagName:"随邀"});
            }
        }
        guestListDom.innerHTML = "本次到场嘉宾：";
        meetingGuests.forEach(poet => {
            guestListDom.innerHTML += `
                <div class="guest-item">
                    <span>【${poet.dynasty}】${poet.name}</span>
                    <span class="guest-tag ${poet.tag}">${poet.tagName}</span>
                </div>
            `
        })
    }
    
    startBtn.onclick = async function(){
        const topic = topicInput.value.trim();
        if(!topic){alert("请先输入讨论话题！");return;}
        if(meetingGuests.length ===0){alert("请先邀请嘉宾！");return;}
        currentTopic = topic;
        isMeetingRunning = true;
        meetingModeHistory = [];
        chatBox.innerHTML = "";
        meetingGuests.sort(() => Math.random() - 0.5);
        meetingBanner.innerText = `--- 本次雅集主题：${currentTopic} ---`;
        addSysMsg(`诸位嘉宾已到齐。今日雅集论道，主题为「${currentTopic}」，请诸位畅抒己见，言辞典雅，以文会友。`, meetingModeHistory);
        
        await sleep(1200);
        for(let poet of meetingGuests){
            await poetSpeak(poet, meetingModeHistory);
            await sleep(800); // 间隔稍微缩短，体验更好
        }
        addSysMsg("第一轮论道暂告一段落，诸位可继续切磋，也可邀请在座的访客一同交流。", meetingModeHistory);
        isMeetingRunning = false;
    }
}

sendBtn.onclick = async function(){
    const q = userInput.value.trim();
    if(!q) return;
    if(currentMode === "chat"){
        if(!currentChatPoet){
            alert("请先在左侧选一位你要交流的诗人！");
            return;
        }
        addUserMsg(q, chatModeHistory);
        userInput.value = "";
        await poetSpeak(currentChatPoet, chatModeHistory);
    }else{
        if(isMeetingRunning){
            alert("等这一轮论道结束再发言哦");
            return;
        }
        addUserMsg(q, meetingModeHistory);
        userInput.value = "";
        isMeetingRunning = true;
        const shuffledGuests = [...meetingGuests].sort(() => Math.random() - 0.5);
        for(let poet of shuffledGuests){
            await poetSpeak(poet, meetingModeHistory);
            await sleep(800);
        }
        isMeetingRunning = false;
    }
}

userInput.onkeydown = function(e){
    if(e.key === "Enter" && !e.isComposing) sendBtn.click();
}

initChatMode();
initMeetingMode();
addSysMsg("欢迎来到AI诗韵工坊！可切换「一对一对谈」与「同台雅集」。", chatModeHistory);
</script>

function getSuggestList(keyword){
  if(!keyword.trim()) return [];
  const kw = keyword.trim().toLowerCase();
  const matchAll = searchData.filter(item=> 
    item.name.toLowerCase().includes(kw) || item.searchText.toLowerCase().includes(kw)
  );
  const poetList = matchAll.filter(i=>i.type==="poet");
  const poemList = matchAll.filter(i=>i.type==="poem");
  const dynastyList = matchAll.filter(i=>i.type==="dynasty");
  return [...poetList,...poemList,...dynastyList];
}

function renderSuggest(list){
  if(list.length ===0){
    suggestPanel.innerHTML = `<div class="suggest-empty">无相关结果</div>`;
  }else{
    suggestPanel.innerHTML = list.map(item=>`
      <div class="suggest-item" data-link="${item.link}">
        <span class="icon">🔍</span>
        <span>${item.name}</span>
      </div>
    `).join("");
    document.querySelectorAll(".suggest-item").forEach(el=>{
      el.onclick = ()=>{
        location.href = el.dataset.link;
      }
    })
  }
  suggestPanel.style.display = "block";
}

searchBtn.onclick = function(){
    searchMask.style.display = 'flex';
    searchInput.value = '';
    suggestPanel.style.display="none";
    errTip.innerText = "";
    searchInput.focus();
}
function closeSearchDialog(){
    searchMask.style.display = 'none';
    suggestPanel.style.display="none";
    errTip.innerText = "";
}
searchCancel.onclick = closeSearchDialog;
searchMask.onclick = function(e){
    if(e.target === searchMask) closeSearchDialog();
}
searchInput.oninput = function(){
    errTip.innerText = "";
    const kw = this.value;
    if(!kw.trim()){
        suggestPanel.style.display="none";
        return;
    }
    const res = getSuggestList(kw);
    renderSuggest(res);
}
function doSearch(){
    let keyword = searchInput.value.trim();
    errTip.innerText = "";
    if(keyword === ""){
        errTip.innerText = "请输入搜索内容";
        return;
    }
    const res = getSuggestList(keyword);
    if(res.length === 0){
        errTip.innerText = "未找到相关诗词、作者或朝代，请更换关键词重试";
        return;
    }
    location.href = `翰墨诗库.html?key=${encodeURIComponent(keyword)}`;
}
searchConfirm.onclick = doSearch;
searchInput.onkeydown = function(e){
    errTip.innerText = "";
    if(e.key === 'Enter') doSearch();
}

const avatarImg = document.getElementById('avatarImg');
const avatarDefault = document.getElementById('avatarDefault');
const saveAvatar = localStorage.getItem('userAvatar');
if(saveAvatar){
    avatarImg.src = saveAvatar;
    avatarImg.style.display = 'block';
    avatarDefault.style.display = 'none';
}
