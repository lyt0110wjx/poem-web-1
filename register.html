<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"SimSun", "KaiTi", serif;
}
body{
    width:100vw;
    height:100vh;
    background-image: url("12.jpg");
    background-repeat: no-repeat;
    background-size: 100% 100%;
    background-position: center;
    display:flex;
    align-items:center;
    justify-content:center;
}
.reg-box{
    width:400px;
    padding:40px 30px;
    background:rgba(255,255,255,0.72);
    border-radius:12px;
    border:1px solid #d4c8b4;
    box-shadow:0 8px 24px rgba(80,60,40,0.12);
}
.reg-box h2{
    text-align:center;
    color:#44382b;
    margin-bottom:30px;
    letter-spacing:6px;
    font-size:28px;
}
.item{
    margin-bottom:20px;
}
.item label{
    display:block;
    color:#55483a;
    margin-bottom:6px;
    font-size:17px;
}
.item input{
    width:100%;
    height:44px;
    padding:0 14px;
    border:1px solid #c9bca8;
    border-radius:6px;
    font-size:16px;
    background:#fff;
    font-family:"SimSun", "KaiTi", serif;
}
#regBtn{
    width:100%;
    height:46px;
    background:#332c22;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
    transition:0.2;
    font-family:"SimSun", "KaiTi", serif;
}
#regBtn:hover{
    background:#4b4032;
}
.msg{
    height:22px;
    text-align:center;
    margin-top:12px;
}
.tip-link{
    text-align:center;
    margin-top:16px;
}
.tip-link a{
    color:#55483a;
    text-decoration:none;
}
.tip-link a:hover{
    text-decoration:underline;
}
.red{
    color:#c84242;
}
.green{
    color:#287c37;
}
</style>
</head>
<body>
<div class="reg-box">
    <h2>注册</h2>
    <div class="item">
        <label>设置账号</label>
        <input type="text" id="regUser" placeholder="请输入账号">
    </div>
    <div class="item">
        <label>设置密码</label>
        <input type="password" id="regPwd" placeholder="请输入密码">
    </div>
    <div class="item">
        <label>确认密码</label>
        <input type="password" id="regPwd2" placeholder="再次输入密码">
    </div>
    <button id="regBtn">注册</button>
    <div class="msg" id="tip"></div>
    <div class="tip-link">
        <a href="login.html">已有账号？去登录</a>
    </div>
</div>
<script>
const userInput = document.getElementById('regUser');
const pwdInput = document.getElementById('regPwd');
const pwd2Input = document.getElementById('regPwd2');
const btn = document.getElementById('regBtn');
const tip = document.getElementById('tip');
btn.onclick = function(){
    let u = userInput.value.trim();
    let p1 = pwdInput.value.trim();
    let p2 = pwd2Input.value.trim();
    let userList = JSON.parse(localStorage.getItem("userList")) || {};
    if(!u || !p1){
        tip.className = "msg red";
        tip.innerText = "账号密码不能为空";
        return;
    }
    if(p1 !== p2){
        tip.className = "msg red";
        tip.innerText = "两次密码不一致";
        return;
    }
    if(userList[u]){
        tip.className = "msg red";
        tip.innerText = "账号已存在，请换一个";
        return;
    }
    userList[u] = p1;
    localStorage.setItem("userList", JSON.stringify(userList));
    tip.className = "msg green";
    tip.innerText = "注册成功，跳转登录页";
    setTimeout(()=>{
        location.href = "login.html";
    },700);
}
</script>
</body>
</html>
