<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的主页</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei"; }
body{
    background:url("01.jpg") no-repeat center center fixed;
    background-size:cover;
    background-color:#f8f5ee;
    min-height:100vh;
}
body::before{
    content:""; position:fixed; inset:0;
    background:rgba(248,245,238,0.55);
    z-index:0; pointer-events:none;
}

/* ===== 导航 ===== */
.nav{
    width:100%; height:60px; background:#332c22;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px; gap:30px; position:relative; z-index:10;
}
.nav-brand{ display:flex; align-items:center; gap:20px; flex-shrink:0; }
.nav-logo{ width:46px; height:46px; border-radius:50%; object-fit:cover; display:block; }
.nav .title{ color:#fff; font-size:25px; font-weight:bold; white-space:nowrap; }
.nav-menu{ display:flex; align-items:center; gap:12px; flex:1; margin-left:370px; overflow:hidden; }
.nav a{ color:#fff; text-decoration:none; padding:8px 14px; border-radius:7px; font-size:15px; white-space:nowrap; }
.nav a.active, .nav a:hover{ background:#d4b878; color:#222; }
.nav-right{ display:flex; align-items:center; gap:16px; flex-shrink:0; }
.search-btn{
    width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06); cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#fff;
}
.search-btn:hover{ background:#d4b878; border-color:#d4b878; color:#222; }
.avatar-link{
    display:block; width:44px; height:44px; border-radius:50%;
    overflow:hidden; border:2px solid #d4b878; background:#fff;
    text-decoration:none; position:relative;
}
.avatar-default{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:22px; color:#332c22; z-index:1;
}
.avatar-img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:none; z-index:2;
}

/* ===== 页面主体 ===== */
.page{ position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:30px 20px 60px; }

/* 资料卡 */
.profile-card{
    display:flex; align-items:center; gap:24px;
    background:rgba(255,253,248,0.92);
    border:2px solid #d4b878; border-radius:16px;
    padding:24px 28px; margin-bottom:24px;
    box-shadow:0 8px 24px rgba(80,60,30,0.15);
}
.profile-avatar{
    width:90px; height:90px; border-radius:50%;
    border:3px solid #d4b878; overflow:hidden; position:relative;
    background:#fff; flex-shrink:0; cursor:pointer;
}
.profile-avatar span{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:40px; color:#332c22; z-index:1;
}
.profile-avatar img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:none; z-index:2;
}
.profile-avatar input{ display:none; }
.profile-info{ flex:1; }
.profile-info .nickname{
    font-size:24px; color:#332c22; font-weight:bold;
    display:flex; align-items:center; gap:10px;
}
.profile-info .nickname .edit-btn{
    font-size:13px; font-weight:normal; color:#8c6b44;
    border:1px solid #c9b58a; background:#fffbf4;
    padding:3px 10px; border-radius:20px; cursor:pointer;
}
.profile-info .motto{ color:#7a5a3a; font-size:14px; margin-top:6px; }
.profile-stats{ display:flex; gap:24px; margin-top:14px; }
.profile-stats div{ text-align:center; }
.profile-stats .num{ font-size:24px; font-weight:bold; color:#8c2626; }
.profile-stats .label{ font-size:12px; color:#7a5a3a; }

/* 功能卡片网格 */
.card-grid{
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:16px; margin-bottom:24px;
}
.func-card{
    background:rgba(255,253,248,0.92);
    border:2px solid #d4b878; border-radius:14px;
    padding:22px 14px; text-align:center; cursor:pointer;
    transition:0.3s; box-shadow:0 6px 16px rgba(80,60,30,0.12);
}
.func-card:hover{ transform:translateY(-6px); border-color:#b54529; }
.func-card .icon{ font-size:32px; margin-bottom:8px; }
.func-card .name{ font-size:17px; color:#332c22; font-weight:bold; }
.func-card .desc{ font-size:12px; color:#8c7b6b; margin-top:4px; }

/* 内容区 */
.content-panel{
    background:rgba(255,253,248,0.94);
    border:2px solid #d4b878; border-radius:16px;
    padding:28px; min-height:200px;
    box-shadow:0 8px 24px rgba(80,60,30,0.15);
}
.content-panel h2{
    font-size:22px; color:#8c2626; margin-bottom:18px;
    border-left:4px solid #d4b878; padding-left:12px;
}
.empty-tip{ text-align:center; color:#8c7b6b; padding:40px 0; font-size:16px; }

/* 列表通用 */
.item-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; border-bottom:1px dashed #e0d3bb; gap:10px;
}
.item-row:last-child{ border-bottom:none; }
.item-row .main{ flex:1; }
.item-row .main .t{ font-size:16px; color:#332c22; }
.item-row .main .m{ font-size:12px; color:#8c7b6b; margin-top:3px; }
.item-row .del{
    background:#b86060; color:#fff; border:none;
    padding:5px 12px; border-radius:6px; cursor:pointer; font-size:13px;
}

/* 设置 */
.setting-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 0; border-bottom:1px dashed #e0d3bb;
}
.setting-row label{ width:90px; color:#5c4428; font-size:15px; }
.setting-row input[type="text"]{
    flex:1; padding:8px 12px; border:1px solid #c9b58a;
    border-radius:8px; font-size:15px; background:#fffbf4;
}
.setting-row button{
    background:#8c6b44; color:#fff; border:none;
    padding:8px 18px; border-radius:8px; cursor:pointer;
}

/* 目标进度条 */
.progress-bar{
    width:100%; height:16px; background:#efe6d7;
    border-radius:10px; overflow:hidden; margin-top:8px;
}
.progress-bar .fill{
    height:100%; background:linear-gradient(90deg,#d4b878,#b54529);
    border-radius:10px; transition:0.4s;
}

/* 搜索弹窗 */
.search-mask{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    z-index:9999; display:none; align-items:center; justify-content:center;
}
.search-dialog{
    width:620px; background:#f8f3e8; border-radius:14px; padding:36px;
    box-shadow:0 10px 35px rgba(0,0,0,0.25); position:relative;
    border:2px solid #b89b6b;
}
.search-dialog .tip-text{ font-size:20px; color:#5c3f24; margin-bottom:24px; letter-spacing:2px; }
.search-input{
    width:100%; height:52px; border:2px solid #9c7d54; border-radius:9px;
    padding:0 18px; font-size:17px; outline:none; background:#fffbf4; color:#443322;
}
.search-input:focus{ border-color:#b89b6b; box-shadow:0 0 0 3px rgba(184,155,107,0.22); }
.search-tip-err{ color:#a83838; font-size:15px; margin-top:10px; min-height:20px; }
.suggest-panel{
    position:absolute; left:36px; right:36px; top:170px;
    background:#fffbf4; border:2px solid #9c7d54; border-top:0;
    border-radius:0 0 9px 9px; box-shadow:0 6px 16px rgba(0,0,0,0.12);
    z-index:100; display:none; max-height:320px; overflow-y:auto;
}
.suggest-item{
    display:flex; align-items:center; padding:13px 18px;
    font-size:16px; color:#5c3f24; cursor:pointer; gap:12px;
}
.suggest-item:hover{ background:#efe6d7; }
.suggest-empty{ padding:20px; text-align:center; color:#887052; font-size:15px; }
.search-btn-group{ display:flex; justify-content:flex-end; gap:18px; margin-top:28px; }
.confirm-btn, .cancel-btn{
    width:106px; height:46px; border:none; border-radius:8px;
    font-size:17px; cursor:pointer; letter-spacing:1px;
}
.confirm-btn{ background:#8c6b44; color:#fff; }
.cancel-btn{ background:#d9c9b3; color:#443322; }
.confirm-btn:hover{ background:#725636; }
.cancel-btn:hover{ background:#c9b89f; }
</style>
</head>
<body>

<!-- 导航 -->
<div class="nav">
    <div class="nav-brand">
        <img src="logo2.png" alt="Logo" class="nav-logo">
        <div class="title">文光载道，诗韵留香</div>
    </div>
    <div class="nav-menu">
        <a href="首页.html">首页</a>
        <a href="诗词沿革.html">诗词沿革</a>
        <a href="诗境寻踪.html">诗境寻踪</a>
        <a href="翰墨诗库.html">翰墨诗库</a>
        <a href="AI诗韵工坊.html">AI诗韵工坊</a>
        <a href="诗词闯关.html">诗词闯关</a>
        <a href="学习打卡.html">学习打卡</a>
        <a href="关于本站.html">关于本站</a>
    </div>
    <div class="nav-right">
        <button class="search-btn" title="搜索">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="6"></circle>
                <line x1="21" y1="21" x2="16.8" y2="16.8"></line>
            </svg>
        </button>
        <a href="主页.html" class="avatar-link" title="个人主页">
            <span class="avatar-default" id="navAvatarDefault">👤</span>
            <img class="avatar-img" id="navAvatarImg" alt="用户头像">
        </a>
    </div>
</div>

<div class="page">
    <!-- 资料卡 -->
    <div class="profile-card">
        <label class="profile-avatar" title="点击上传头像">
            <span id="preDefault">👤</span>
            <img id="preImg" alt="头像">
            <input type="file" id="fileInput" accept="image/*">
        </label>
        <div class="profile-info">
            <div class="nickname">
                <span id="nickName">诗友</span>
                <button class="edit-btn" id="editNameBtn">修改昵称</button>
            </div>
            <div class="motto">腹有诗书气自华，读书万卷始通神。</div>
            <div class="profile-stats">
                <div><div class="num" id="statScore">0</div><div class="label">学分</div></div>
                <div><div class="num" id="statWrong">0</div><div class="label">错题</div></div>
                <div><div class="num" id="statDays">0</div><div class="label">打卡天数</div></div>
                <div><div class="num" id="statPoem">0</div><div class="label">背诵篇目</div></div>
            </div>
        </div>
    </div>

    <!-- 功能卡片 -->
    <div class="card-grid">
        <div class="func-card" data-tab="wrong"><div class="icon">📕</div><div class="name">错题本</div><div class="desc">闯关错题回顾</div></div>
        <div class="func-card" data-tab="record"><div class="icon">📅</div><div class="name">学习记录</div><div class="desc">打卡与背诵</div></div>
        <div class="func-card" data-tab="favorite"><div class="icon">⭐</div><div class="name">我的收藏</div><div class="desc">收藏诗词</div></div>
        <div class="func-card" data-tab="credit"><div class="icon">🏅</div><div class="name">学分明细</div><div class="desc">积分与徽章</div></div>
        <div class="func-card" data-tab="goal"><div class="icon">🎯</div><div class="name">学习目标</div><div class="desc">每日目标进度</div></div>
        <div class="func-card" data-tab="msg"><div class="icon">🔔</div><div class="name">消息通知</div><div class="desc">系统消息</div></div>
        <div class="func-card" data-tab="setting"><div class="icon">⚙️</div><div class="name">设置</div><div class="desc">昵称与数据</div></div>
        <div class="func-card" data-tab="logout"><div class="icon">🚪</div><div class="name">退出登录</div><div class="desc">安全退出</div></div>
    </div>

    <!-- 内容区 -->
    <div class="content-panel" id="contentPanel">
        <h2 id="panelTitle">欢迎来到个人中心</h2>
        <div id="panelBody"><div class="empty-tip">点击上方卡片查看内容 ✨</div></div>
    </div>
</div>

<!-- 搜索弹窗 -->
<div class="search-mask" id="searchMask">
    <div class="search-dialog">
        <div class="tip-text">请输入诗词、作者或标题进行搜索：</div>
        <input type="text" class="search-input" id="searchInput" placeholder="例如：李白、静夜思">
        <div class="search-tip-err" id="errTip"></div>
        <div class="suggest-panel" id="suggestPanel"></div>
        <div class="search-btn-group">
            <button class="confirm-btn" id="searchConfirm">确定</button>
            <button class="cancel-btn" id="searchCancel">取消</button>
        </div>
    </div>
</div>

<script>
/* ========== 数据读取 ========== */
function readJSON(key, def){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
    catch(e){ return def; }
}
const score        = Number(localStorage.getItem("quizScore") || 0);
const wrongBook    = readJSON("wrongBook", []);
const quizUnlock   = readJSON("quizUnlock", [true,false,false,false,false,false]);
const poemTask     = readJSON("poemTask", []);
const checkInDays  = readJSON("checkInDays", []);
const favorites    = readJSON("favorites", []);
const userName     = localStorage.getItem("userName") || "诗友";
const studyGoal    = readJSON("studyGoal", { daily: 2 });
const userAvatar   = localStorage.getItem("userAvatar");

/* 徽章 */
function getBadge(s){
    if(s < 60) return "小诗童";
    if(s < 120) return "诗学士";
    if(s < 180) return "诗卿";
    return "诗圣";
}

/* ========== 资料卡渲染 ========== */
document.getElementById("nickName").innerText = userName;
document.getElementById("statScore").innerText = score;
document.getElementById("statWrong").innerText = wrongBook.length;
document.getElementById("statDays").innerText = checkInDays.length;
document.getElementById("statPoem").innerText = poemTask.length;

if(userAvatar){
    document.getElementById("preImg").src = userAvatar;
    document.getElementById("preImg").style.display = "block";
    document.getElementById("preDefault").style.display = "none";
    document.getElementById("navAvatarImg").src = userAvatar;
    document.getElementById("navAvatarImg").style.display = "block";
    document.getElementById("navAvatarDefault").style.display = "none";
}

/* 头像上传（沿用原逻辑） */
document.getElementById("fileInput").onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith("image/")) return alert("请选择图片");
    const reader = new FileReader();
    reader.onload = function(ev){
        localStorage.setItem("userAvatar", ev.target.result);
        document.getElementById("preImg").src = ev.target.result;
        document.getElementById("preImg").style.display = "block";
        document.getElementById("preDefault").style.display = "none";
        document.getElementById("navAvatarImg").src = ev.target.result;
        document.getElementById("navAvatarImg").style.display = "block";
        document.getElementById("navAvatarDefault").style.display = "none";
    };
    reader.readAsDataURL(file);
};

/* ========== 功能卡片渲染 ========== */
const panelTitle = document.getElementById("panelTitle");
const panelBody  = document.getElementById("panelBody");

function renderWrong(){
    panelTitle.innerText = "📕 我的错题本";
    if(!wrongBook.length){
        panelBody.innerHTML = '<div class="empty-tip">暂无错题，去诗词闯关挑战一下吧！</div>';
        return;
    }
    panelBody.innerHTML = wrongBook.map(k=>{
        const [lv, idx] = String(k).split("-").map(Number);
        return `<div class="item-row">
            <div class="main"><div class="t">第 ${lv+1} 关 · 第 ${idx+1} 题</div>
            <div class="m">题目编号：${k}</div></div>
            <button class="del" data-key="${k}">移除</button>
        </div>`;
    }).join("");
    panelBody.querySelectorAll(".del").forEach(btn=>{
        btn.onclick = ()=>{
            const key = btn.dataset.key;
            const list = readJSON("wrongBook", []).filter(k=>k!==key);
            localStorage.setItem("wrongBook", JSON.stringify(list));
            renderWrong();
            document.getElementById("statWrong").innerText = list.length;
        };
    });
}

function renderRecord(){
    panelTitle.innerText = "📅 学习记录";
    let html = "";
    if(checkInDays.length){
        html += `<h3 style="color:#8c2626;font-size:17px;margin-bottom:10px;">打卡日期（${checkInDays.length}天）</h3>`;
        html += checkInDays.slice().sort().reverse().map(d=>`<div class="item-row"><div class="main"><div class="t">✅ ${d}</div></div></div>`).join("");
    }
    if(poemTask.length){
        html += `<h3 style="color:#8c2626;font-size:17px;margin:18px 0 10px;">背诵任务（${poemTask.length}篇）</h3>`;
        html += poemTask.map(p=>`<div class="item-row"><div class="main"><div class="t">《${p.title}》 · ${p.author}</div>
            <div class="m">复习次数：${(p.reviewRecords||[]).length} 次</div></div></div>`).join("");
    }
    if(!html) html = '<div class="empty-tip">暂无学习记录，去学习打卡页开始吧！</div>';
    panelBody.innerHTML = html;
}

function renderFavorite(){
    panelTitle.innerText = "⭐ 我的收藏";
    if(!favorites.length){
        panelBody.innerHTML = '<div class="empty-tip">暂无收藏，功能即将开放～</div>';
        return;
    }
    panelBody.innerHTML = favorites.map(f=>`<div class="item-row"><div class="main"><div class="t">${f.title||f}</div></div></div>`).join("");
}

function renderCredit(){
    panelTitle.innerText = "🏅 学分明细";
    panelBody.innerHTML = `
        <div class="item-row"><div class="main"><div class="t">当前总学分</div></div><div style="font-size:22px;color:#8c2626;font-weight:bold;">${score}</div></div>
        <div class="item-row"><div class="main"><div class="t">当前徽章</div></div><div style="font-size:18px;color:#8c6b44;">${getBadge(score)}</div></div>
        <div class="item-row"><div class="main"><div class="t">已解锁关卡</div></div><div style="font-size:18px;">${quizUnlock.filter(Boolean).length} / ${quizUnlock.length}</div></div>
        <div class="item-row"><div class="main"><div class="t">错题数量</div></div><div style="font-size:18px;">${wrongBook.length}</div></div>
        <div class="empty-tip" style="padding-top:20px;">学分来自诗词闯关答题，答对一题 +10 分。</div>
    `;
}

function renderGoal(){
    panelTitle.innerText = "🎯 学习目标";
    const today = new Date().toLocaleDateString();
    const todayDone = checkInDays.includes(today) ? 1 : 0;
    const daily = studyGoal.daily || 2;
    const percent = Math.min(100, Math.round(todayDone / daily * 100));
    panelBody.innerHTML = `
        <div style="margin-bottom:16px;">
            <div style="display:flex;justify-content:space-between;font-size:15px;color:#5c4428;">
                <span>今日打卡目标：${daily} 次</span><span>${todayDone} / ${daily}</span>
            </div>
            <div class="progress-bar"><div class="fill" style="width:${percent}%"></div></div>
        </div>
        <div class="setting-row">
            <label>每日目标</label>
            <input type="text" id="goalInput" value="${daily}">
            <button id="goalSave">保存</button>
        </div>
        <div class="empty-tip">坚持每日学习，循序渐进，积少成多。</div>
    `;
    document.getElementById("goalSave").onclick = ()=>{
        let v = parseInt(document.getElementById("goalInput").value);
        if(!v || v < 1) return alert("请输入大于0的数字");
        localStorage.setItem("studyGoal", JSON.stringify({daily: v}));
        renderGoal();
    };
}

function renderMsg(){
    panelTitle.innerText = "🔔 消息通知";
    panelBody.innerHTML = `
        <div class="item-row"><div class="main"><div class="t">📢 欢迎使用文光载道</div><div class="m">欢迎来到诗词学习平台，祝你学有所成</div></div></div>
        <div class="item-row"><div class="main"><div class="t">🎉 闯关提示</div><div class="m">完成关卡可解锁下一关并获取学分</div></div></div>
        <div class="item-row"><div class="main"><div class="t">💡 打卡提醒</div><div class="m">坚持每日打卡，复习更牢固</div></div></div>
    `;
}

function renderSetting(){
    panelTitle.innerText = "⚙️ 设置";
    panelBody.innerHTML = `
        <div class="setting-row">
            <label>昵称</label>
            <input type="text" id="setName" value="${userName}">
            <button id="saveName">保存</button>
        </div>
        <div class="setting-row">
            <label>背景图</label>
            <input type="text" id="setBg" value="01.jpg" placeholder="填写同目录图片名">
            <button id="saveBg">应用</button>
        </div>
        <div class="setting-row">
            <label>清除数据</label>
            <button id="clearData" style="background:#b86060;">清除本地数据</button>
        </div>
        <div class="empty-tip">修改昵称后刷新页面生效；背景图填入同目录图片文件名（如 bg.jpg）。</div>
    `;
    document.getElementById("saveName").onclick = ()=>{
        const v = document.getElementById("setName").value.trim();
        if(!v) return alert("昵称不能为空");
        localStorage.setItem("userName", v);
        document.getElementById("nickName").innerText = v;
        alert("昵称已保存");
    };
    document.getElementById("saveBg").onclick = ()=>{
        const v = document.getElementById("setBg").value.trim();
        if(!v) return alert("请输入图片名");

function logout(){
    if(!confirm("确定退出登录吗？")) return;
    localStorage.removeItem("isLogin");
    localStorage.removeItem("userName");
    location.href = "首页.html";
}

/* 卡片点击 */
document.querySelectorAll(".func-card").forEach(card=>{
    card.onclick = ()=>{
        const tab = card.dataset.tab;
        if(tab === "wrong") renderWrong();
        else if(tab === "record") renderRecord();
        else if(tab === "favorite") renderFavorite();
        else if(tab === "credit") renderCredit();
        else if(tab === "goal") renderGoal();
        else if(tab === "msg") renderMsg();
        else if(tab === "setting") renderSetting();
        else if(tab === "logout") logout();
    };
});

    if(!keyword.trim()) return [];
    const kw = keyword.trim().toLowerCase();
    const all = searchData.filter(i=>i.name.toLowerCase().includes(kw) || i.searchText.toLowerCase().includes(kw));
    return [...all.filter(i=>i.type==="poet"), ...all.filter(i=>i.type==="poem"), ...all.filter(i=>i.type==="dynasty")];
}
function renderSuggest(list){
    if(!list.length){ suggestPanel.innerHTML = '<div class="suggest-empty">无相关结果</div>'; }
    else{
        suggestPanel.innerHTML = list.map(i=>`<div class="suggest-item" data-link="${i.link}"><span class="icon">🔍</span><span>${i.name}</span></div>`).join("");
        document.querySelectorAll(".suggest-item").forEach(el=>{
            el.onclick = ()=> location.href = el.dataset.link;
        });
    }
    suggestPanel.style.display = "block";
}
searchBtn.onclick = ()=>{
    searchMask.style.display = "flex";
    searchInput.value = "";
    suggestPanel.style.display = "none";
    errTip.innerText = "";
    searchInput.focus();
};
function closeSearchDialog(){
    searchMask.style.display = "none";
    suggestPanel.style.display = "none";
    errTip.innerText = "";
}
searchCancel.onclick = closeSearchDialog;
searchMask.onclick = e => { if(e.target === searchMask) closeSearchDialog(); };
searchInput.oninput = function(){
    errTip.innerText = "";
    if(!this.value.trim()){ suggestPanel.style.display = "none"; return; }
    renderSuggest(getSuggestList(this.value));
};
function doSearch(){
    const kw = searchInput.value.trim();
    errTip.innerText = "";
    if(!kw){ errTip.innerText = "请输入搜索内容"; return; }
    if(!getSuggestList(kw).length){ errTip.innerText = "未找到相关诗词、作者或朝代"; return; }
    location.href = `翰墨诗库.html?key=${encodeURIComponent(kw)}`;
}
searchConfirm.onclick = doSearch;
searchInput.onkeydown = e => { if(e.key === "Enter") doSearch(); };
</script>
</body>
</html>
