<script>
// 前端不再保存任何密钥，全部交由后端处理！
let taskList = JSON.parse(localStorage.getItem("poemTask")) || [];
let checkInDays = JSON.parse(localStorage.getItem("checkInDays")) || [];
let chartInstance = null;
let currentCheckPoem = null;

// 内置常用诗词库（急速响应，避免网络慢）
const localPoemDB = {
    "登高": {
        title: "登高", author: "杜甫",
        content: "风急天高猿啸哀，渚清沙白鸟飞回。\n无边落木萧萧下，不尽长江滚滚来。\n万里悲秋常作客，百年多病独登台。\n艰难苦恨繁霜鬓，潦倒新停浊酒杯。",
        note: "大历二年（767年）杜甫在夔州所作，被誉为“古今七律第一”。",
        breakHint: "前四句写登高见闻，紧扣秋天特色；后四句写登高所感，由秋及人。",
        errorWords: "渚（zhǔ）、啸（xiào）、繁霜鬓（bìn）",
        memoryTip: "风急-天高-猿啸-渚清-沙白-鸟飞，体会对偶。",
        difficulty: "中等"
    },
    "静夜思": {
        title: "静夜思", author: "李白",
        content: "床前明月光，疑是地上霜。\n举头望明月，低头思故乡。",
        note: "在寂静的月夜思念家乡的感受。",
        breakHint: "前两句写景，后两句抒情。",
        errorWords: "疑（yí）",
        memoryTip: "明月光 -> 地上霜 -> 举头 -> 低头。",
        difficulty: "简单"
    }
};

function saveData(){
    localStorage.setItem("poemTask", JSON.stringify(taskList));
    localStorage.setItem("checkInDays", JSON.stringify(checkInDays));
}

function renderCalendar(){
    const wrap = document.getElementById("calendarWrap");
    wrap.innerHTML = "";
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const todayDate = now.getDate();
    
    const weekDays = ["日","一","二","三","四","五","六"];
    weekDays.forEach(w => wrap.innerHTML += `<div class="calendar-head">${w}</div>`);

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) wrap.innerHTML += `<div></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = new Date(year, month, d).toLocaleDateString();
        let cls = "calendar-day";
        if (d === todayDate) cls += " today";
        if (checkInDays.includes(dateStr)) cls += " done";
        else if (d < todayDate) cls += " miss";
        wrap.innerHTML += `<div class="${cls}">${d}</div>`;
    }
}

function renderAll(){
    renderStats();
    renderCalendar();
    renderTaskList();
    setTimeout(updateChart, 100);
}

function renderStats(){
    const today = new Date().setHours(0,0,0,0);
    const todayStr = new Date().toLocaleDateString();
    let wait = 0, finish = 0, totalReviews = 0;
    
    taskList.forEach(i => {
        if (i.nextReview <= today) wait++;
        if (i.reviewRecords.length > 0) finish++;
        totalReviews += i.reviewRecords.length;
    });

    document.getElementById("totalPoem").innerText = taskList.length;
    document.getElementById("waitReview").innerText = wait;
    document.getElementById("todayDone").innerText = checkInDays.includes(todayStr) ? finish : 0; 
    document.getElementById("totalReviews").innerText = totalReviews;
    document.getElementById("finishRate").innerText = taskList.length ? Math.round(finish/taskList.length*100) + "%" : "0%";
    document.getElementById("continueDay").innerText = calcContinueDay();
}

function calcContinueDay(){
    if (checkInDays.length === 0) return 0;
    const days = [...new Set(checkInDays)].map(d => new Date(d).setHours(0,0,0,0)).sort((a,b)=>b-a);
    let continueNum = 0;
    let now = new Date().setHours(0,0,0,0);
    let expected = now;
    
    for (let t of days) {
        if (t === expected) {
            continueNum++;
            expected -= 86400000;
        } else if (t < expected) break;
    }
    if (continueNum === 0 && days[0] === now - 86400000) {
        expected = now - 86400000;
        for (let t of days) {
            if (t === expected) { continueNum++; expected -= 86400000; }
            else break;
        }
    }
    return continueNum;
}

function renderTaskList(){
    const wrap = document.getElementById("taskList");
    wrap.innerHTML = "";
    const today = new Date().setHours(0,0,0,0);

    if (taskList.length === 0) {
        wrap.innerHTML = '<div style="text-align:center;color:#8c7b6b;padding:20px;">还没有背诵任务，去上方添加一首吧~</div>';
        return;
    }

    const sorted = [...taskList].sort((a,b) => a.nextReview - b.nextReview);

    sorted.forEach(item => {
        const isOver = item.nextReview < today;
        let tagCls = "tag tag-";
        if (item.difficulty === "简单") tagCls += "easy";
        else if (item.difficulty === "中等") tagCls += "mid";
        else tagCls += "hard";
        if (isOver) tagCls = "tag tag-overdue";

        const reviewDate = new Date(item.nextReview).toLocaleDateString();
        wrap.innerHTML += `
        <div class="task-item">
            <div class="task-info">
                <div class="task-name">
                    《${item.title}》 · ${item.author}
                    <span class="${tagCls}">${item.difficulty}</span>
                    ${isOver ? '<span style="color:#c94444;font-size:12px;margin-left:6px;">[逾期]</span>' : ''}
                </div>
                <div class="task-meta">
                    下次：${reviewDate} | 已复习 ${item.reviewRecords.length} 次
                    <button class="del-btn" onclick="deleteTask(${item.id})">删除</button>
                    <button style="border:none;background:none;color:#8c2626;cursor:pointer;margin-left:6px;font-size:13px;" onclick="openModal(${item.id})">详情</button>
                </div>
            </div>
            <div class="level-group">
                <button onclick="submitReview(${item.id},'bad')">🔴 不熟</button>
                <button onclick="submitReview(${item.id},'mid')">🟡 一般</button>
                <button onclick="submitReview(${item.id},'good')">🟢 熟练</button>
            </div>
        </div>`;
    });
}

function deleteTask(id){
    if (!confirm("确定删除这首诗词的背诵任务吗？")) return;
    taskList = taskList.filter(t => t.id !== id);
    saveData();
    renderAll();
}

function submitReview(taskId, level){
    const todayStr = new Date().toLocaleDateString();
    if (!checkInDays.includes(todayStr)) checkInDays.push(todayStr);
    const idx = taskList.findIndex(t => t.id === taskId);
    const item = taskList[idx];
    item.reviewRecords.push({ time: Date.now(), level });

    const rules = {
        bad:  { good: 2, mid: 1, bad: 1 },
        mid:  { good: 4, mid: 2, bad: 1 },
        good: { good: 7, mid: 4, bad: 2 }
    };
    const days = rules[item.lastLevel]?.[level] || 1;
    
    item.nextReview = getDayTs(days);
    item.lastLevel = level;
    saveData();
    renderAll();
    alert(`打卡成功！《${item.title}》将在 ${days} 天后再次复习。`);
}

function getDayTs(addDay){
    const d = new Date();
    d.setDate(d.getDate() + addDay);
    d.setHours(0,0,0,0);
    return d.getTime();
}

async function addPoemByAI(e){
    const input = document.getElementById("poemInput").value.trim();
    if (!input) return alert("请输入诗词名，例如：登高，杜甫");

    const parts = input.split(/[，,\s]+/);
    const title = parts[0];
    const author = parts[1] || "未知";

    let poemInfo = null;

    // 优先读本地极速库
    if (localPoemDB[title]) {
        poemInfo = localPoemDB[title];
    } else {
        const btn = e ? e.target : document.querySelector(".btn");
        const oldText = btn.innerText;
        btn.innerText = "AI 解析生成中...";
        btn.disabled = true;

        const prompt = `你是中小学古诗词辅导老师，处理诗词【${input}】。
请输出严格JSON，不要有任何 markdown 格式，不要有多余文字。字段如下：
{
    "title": "诗词标题",
    "author": "作者",
    "content": "完整原诗（带换行符\\n）",
    "note": "简短注释/背景",
    "breakHint": "分句或分段背诵提示",
    "errorWords": "易错字",
    "memoryTip": "记忆技巧",
    "difficulty": "简单/中等/难"
}`;

        try {
            // 【核心修改】请求你自己的本地后端服务器，不再直接请求豆包！
            const res = await fetch("/api/generate-poem", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({ 
                    prompt: prompt 
                })
            });
            
            if (!res.ok) throw new Error("本地后端请求失败");
            
            const json = await res.json();
            let raw = json.content; // 后端传回来的内容
            
            raw = raw.replace(/```json/g, "").replace(/```/g, "").trim();
            poemInfo = JSON.parse(raw);
            
        } catch(e) {
            console.error("请求解析失败：", e);
        } finally {
            btn.innerText = oldText;
            btn.disabled = false;
        }

        // 兜底：手动输入
        if (!poemInfo) {
            const isAddManual = confirm(`AI 未响应或解析失败。\n\n点击【确定】手动输入这首诗的原诗及提示。\n点击【取消】放弃添加。`);
            if (!isAddManual) return;

            const manualContent = prompt(`请输入《${title}》的完整原文（可使用 \\n 换行）：`);
            if (manualContent === null) return;

            poemInfo = {
                title: title, author: author,
                content: manualContent.replace(/\\n/g, '\n'),
                note: prompt("请输入注释（选填）：") || "暂无注释",
                breakHint: prompt("请输入背诵提示（选填）：") || "暂未设置",
                errorWords: prompt("请输入易错字（选填）：") || "无",
                memoryTip: prompt("请输入记忆技巧（选填）：") || "多读多背",
                difficulty: "中等"
            };
        }
    }

    const newTask = {
        id: Date.now(),
        ...poemInfo,
        createTime: Date.now(),
        reviewRecords: [],
        nextReview: getDayTs(1),
        lastLevel: "mid"
    };
    
    taskList.push(newTask);
    saveData();
    renderAll();
    document.getElementById("poemInput").value = "";
    alert(`🎉 添加成功！《${newTask.title}》已加入复习清单。`);
}

function submitCheckAnswer(){
    const ans = document.getElementById("userAnswer").value.trim();
    if (!ans) return alert("请输入答案");
    
    // 去掉标点和空格，只比对纯文字
    const origin = (currentCheckPoem.content || "").replace(/[，。！？、,.!? \n]/g, "");
    const input = ans.replace(/[，。！？、,.!? \n]/g, "");

    if (!origin) {
        document.getElementById("checkResult").style.display = "block";
        document.getElementById("checkResult").innerHTML = "⚠️ 标准原诗缺失，无法比对。请删除此任务并重新添加。";
        return;
    }

    let html = "";
    let matchCount = 0;
    
    // 逐字比对（以原诗长度为基准）
    for (let i = 0; i < origin.length; i++) {
        const charO = origin[i];
        const charI = input[i];
        
        if (charI === charO) {
            matchCount++;
            html += `<span class="highlight-ok">${charI}</span>`;
        } else {
            if (charI) {
                // 写错了（划掉用户的，显示原诗正确的）
                html += `<span class="highlight-err">${charI}</span><span class="highlight-ok">${charO}</span>`;
            } else {
                // 漏写了
                html += `<span style="color:#999;text-decoration:underline;">[漏:${charO}]</span>`;
            }
        }
    }
    
    // 如果用户写得比原诗还长，说明多写了字
    if (input.length > origin.length) {
        html += `<span class="highlight-err">[多写了:${input.substring(origin.length)}]</span>`;
    }

    const score = Math.round((matchCount / origin.length) * 100);
    let evalStr = "";
    if (score === 100) evalStr = "🎉 完美无瑕！一字不差！";
    else if (score >= 80) evalStr = "👍 非常棒！只有一点小瑕疵。";
    else if (score >= 50) evalStr = "💪 还可以，还需要多复习几遍！";
    else evalStr = "📖 熟练度不够，建议回到原文重读。";

    document.getElementById("checkResult").style.display = "block";
    document.getElementById("checkResult").innerHTML = `
        <div style="margin-bottom:8px;"><strong>比对结果：</strong>${evalStr} (匹配度 ${score}%)</div>
        <div style="font-size:16px; line-height:1.8; letter-spacing:1px;">${html}</div>
    `;
}

function updateChart(){
    if (typeof Chart === "undefined") return;
    const ctx = document.getElementById("forgetChart").getContext("2d");
    if (chartInstance) chartInstance.destroy();

    let avgLevel = 0;
    if (taskList.length > 0) {
        let sum = 0;
        taskList.forEach(t => {
            if (t.lastLevel === 'good') sum += 3;
            else if (t.lastLevel === 'mid') sum += 2;
            else sum += 1;
        });
        avgLevel = sum / taskList.length;
    }
    const baseRetention = avgLevel === 0 ? 50 : (avgLevel / 3) * 100;

    chartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: ["第0天", "第1天", "第2天", "第4天", "第7天", "第15天"],
            datasets: [{
                label: "当前平均记忆留存率(%)",
                data: [100, 100 - (100-baseRetention)*0.3, 100 - (100-baseRetention)*0.5, 100 - (100-baseRetention)*0.7, 100 - (100-baseRetention)*0.9, baseRetention],
                borderColor: "#d4b878",
                backgroundColor: "rgba(212,184,120,0.15)",
                fill: true,
                tension: 0.4,
                pointBackgroundColor: "#8c2626"
            }]
        },
        options: {
            responsive: true, 
            maintainAspectRatio: false,
            scales: { y: { min: 0, max: 100, ticks: { stepSize: 20 } } }
        }
    });
}

function openModal(id){
    const item = taskList.find(x => x.id === id);
    document.getElementById("modalTitle").innerText = item.title + " - " + item.author;
    document.getElementById("modalBody").innerHTML = `

        <p style="margin-top:12px;"><strong>注释：</strong>${item.note}</p>

        <p style="margin-top:12px;"><strong>记忆技巧：</strong>${item.memoryTip}</p>
    `;
    document.getElementById("poemModal").style.display = "flex";
}

function exportRecord(){
    if(taskList.length === 0) return alert("暂无数据导出");
    const str = JSON.stringify({ taskList, checkInDays }, null, 2);
    const blob = new Blob([str], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "诗词背诵数据备份.json";
    a.click();
}

function clearAllData(){
    if (!confirm("⚠️ 警告：这会清空你的所有背诵任务和打卡记录，且无法恢复。确定吗？")) return;
    localStorage.removeItem("poemTask");
    localStorage.removeItem("checkInDays");
    taskList = [];
    checkInDays = [];
    renderAll();
}

renderAll();

function getSuggestList(keyword){
  if(!keyword.trim()) return [];
  const kw = keyword.trim().toLowerCase();
  const matchAll = searchData.filter(item=> 
    item.name.toLowerCase().includes(kw) || item.searchText.toLowerCase().includes(kw)
  );
  const poetList = matchAll.filter(i=>i.type==="poet");
  const poemList = matchAll.filter(i=>i.type==="poem");
  const dynastyList = matchAll.filter(i=>i.type==="dynasty");
  return [...poetList,...poemList,...dynastyList];
}

function renderSuggest(list){
  if(list.length ===0){
    suggestPanel.innerHTML = `<div class="suggest-empty">无相关结果</div>`;
  }else{
    suggestPanel.innerHTML = list.map(item=>`
      <div class="suggest-item" data-link="${item.link}">
        <span class="icon">🔍</span>
        <span>${item.name}</span>
      </div>
    `).join("");
    document.querySelectorAll(".suggest-item").forEach(el=>{
      el.onclick = ()=>{
        location.href = el.dataset.link;
      }
    })
  }
  suggestPanel.style.display = "block";
}

searchBtn.onclick = function(){
    searchMask.style.display = 'flex';
    searchInput.value = '';
    suggestPanel.style.display="none";
    errTip.innerText = "";
    searchInput.focus();
}
function closeSearchDialog(){
    searchMask.style.display = 'none';
    suggestPanel.style.display="none";
    errTip.innerText = "";
}
searchCancel.onclick = closeSearchDialog;
searchMask.onclick = function(e){
    if(e.target === searchMask) closeSearchDialog();
}
searchInput.oninput = function(){
    errTip.innerText = "";
    const kw = this.value;
    if(!kw.trim()){
        suggestPanel.style.display="none";
        return;
    }
    const res = getSuggestList(kw);
    renderSuggest(res);
}
function doSearch(){
    let keyword = searchInput.value.trim();
    errTip.innerText = "";
    if(keyword === ""){
        errTip.innerText = "请输入搜索内容";
        return;
    }
    const res = getSuggestList(keyword);
    if(res.length === 0){
        errTip.innerText = "未找到相关诗词、作者或朝代，请更换关键词重试";
        return;
    }
    location.href = `翰墨诗库.html?key=${encodeURIComponent(keyword)}`;
}
searchConfirm.onclick = doSearch;
searchInput.onkeydown = function(e){
    errTip.innerText = "";
    if(e.key === 'Enter') doSearch();
}

const avatarImg = document.getElementById('avatarImg');
const avatarDefault = document.getElementById('avatarDefault');
const saveAvatar = localStorage.getItem('userAvatar');
if(saveAvatar){
    avatarImg.src = saveAvatar;
    avatarImg.style.display = 'block';
    avatarDefault.style.display = 'none';
}
