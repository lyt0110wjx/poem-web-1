<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const wrap = document.getElementById("canvasWrap");
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
wrap.appendChild(renderer.domElement);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const cardList = [];
const disk = new THREE.Group();
scene.add(disk);

const data = [
  {
    name: "先秦",
    img: "先秦1.jpg",
    intro: "先秦诗文古朴厚重，楚辞浪漫、诸子文采初兴，为华夏文学源头。",
    poets: [
      { name: "屈原", link: "屈原.html" },
      { name: "宋玉", link: "宋玉.html" },
      { name: "孟子", link: "孟子.html" },
      { name: "庄子", link: "庄子.html" },
      { name: "荀子", link: "荀子.html" },
      { name: "贾谊", link: "贾谊.html" }
    ]
  },
  {
    name: "汉代",
    img: "汉代1.jpg",
    intro: "汉赋铺采摛文，乐府质朴动人，史传散文成就极高。",
    poets: [
      { name: "司马相如", link: "司马相如.html" },
      { name: "司马迁", link: "司马迁.html" },
      { name: "班固", link: "班固.html" },
      { name: "扬雄", link: "扬雄.html" },
      { name: "张衡", link: "张衡.html" },
      { name: "蔡琰", link: "蔡琰.html" }
    ]
  },
  {
    name: "魏晋南北朝",
    img: "魏晋南北朝1.jpg",
    intro: "文学自觉时代，风骨清逸，山水田园诗开始萌芽。",
    poets: [
      { name: "曹操", link: "曹操.html" },
      { name: "曹丕", link: "曹丕.html" },
      { name: "曹植", link: "曹植.html" },
      { name: "陶渊明", link: "陶渊明.html" },
      { name: "谢灵运", link: "谢灵运.html" },
      { name: "谢道韫", link: "谢道韫.html" }
    ]
  },
  {
    name: "唐朝",
    img: "唐朝1.jpg",
    intro: "唐诗鼎盛，流派纷呈，气象万千，是古典诗歌巅峰。",
    poets: [
      { name: "王维", link: "王维.html" },
      { name: "李白", link: "李白.html" },
      { name: "杜甫", link: "杜甫.html" },
      { name: "韩愈", link: "韩愈.html" },
      { name: "白居易", link: "白居易.html" },
      { name: "李商隐", link: "李商隐.html" }
    ]
  },
  {
    name: "宋朝",
    img: "宋朝1.jpg",
    intro: "宋词独领风骚，词作婉约豪放并举，诗文理趣盎然。",
    poets: [
      { name: "欧阳修", link: "欧阳修.html" },
      { name: "柳永", link: "柳永.html" },
      { name: "苏轼", link: "苏轼.html" },
      { name: "李清照", link: "李清照.html" },
      { name: "陆游", link: "陆游.html" },
      { name: "辛弃疾", link: "辛弃疾.html" }
    ]
  },
  {
    name: "元朝",
    img: "元朝1.jpg",
    intro: "元曲兴盛，散曲杂剧通俗鲜活，贴近市井人间百态。",
    poets: [
      { name: "关汉卿", link: "关汉卿.html" },
      { name: "马致远", link: "马致远.html" },
      { name: "白朴", link: "白朴.html" },
      { name: "郑光祖", link: "郑光祖.html" },
      { name: "王实甫", link: "王实甫.html" },
      { name: "张养浩", link: "张养浩.html" }
    ]
  }
];
const cardW = 2;
const cardH = 2.8;
const geo = new THREE.PlaneGeometry(cardW, cardH);
const diskRadius = 8.5;

// 获取url搜索参数
function getUrlParam(name) {
  const params = new URLSearchParams(location.search);
  return params.get(name) || "";
}
const searchKey = getUrlParam("key").trim();
let targetCardIndex = -1;
let jumpLink = "";

if(searchKey){
  for(let i=0; i<data.length; i++){
    const item = data[i];
    // 优先匹配诗人，匹配到直接记录跳转链接
    for(let p of item.poets){
      if(p.name.includes(searchKey)){
        jumpLink = p.link;
        break;
      }
    }
    if(jumpLink){
      break;
    }
    // 没匹配到诗人，再匹配朝代
    if(item.name.includes(searchKey)){
      targetCardIndex = i;
    }
  }
  // 找到诗人，直接跳转诗人页面
  if(jumpLink){
    location.href = jumpLink;
  }
}

function createBackTexture(item) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 720;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#f7efe0";
  ctx.fillRect(0, 0, 512, 720);
  ctx.textAlign = "center";
  ctx.fillStyle = "#3b2b16";
  ctx.font = "bold 42px SimSun";
  ctx.fillText(item.name, 256, 120);
  ctx.font = "22px SimSun";
  ctx.fillStyle = "#555";
  const lineArr = item.intro.match(/.{1,15}/g);
  let y = 180;
  lineArr.forEach(line => {
    ctx.fillText(line, 256, y);
    y += 36;
  })
  y += 50;
  ctx.font = "26px SimSun";
  ctx.fillStyle = "#6b3400";
  for(let i=0; i<item.poets.length; i++){
    const p = item.poets[i];
    ctx.fillText(p.name, 256, y);
    p.hot = {
      x1: 120,
      x2: 392,
      y1: y - 20,
      y2: y + 20
    }
    y += 46;
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}

function loadImageToTexture(url, callback){
  const img = new Image();
  img.src = url + "?v=" + Math.random();
  img.onload = function(){
    const tex = new THREE.CanvasTexture(img);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    callback(tex);
  }
  img.onerror = function(){
    console.error("图片加载失败：", url);
    callback(null);
  }
}

function buildCard(item, index) {
  const group = new THREE.Group();
  const frontMat = new THREE.MeshBasicMaterial({
    color:0xf0e8da,
    side:THREE.FrontSide
  });
  const frontMesh = new THREE.Mesh(geo, frontMat);

  const backTex = createBackTexture(item);
  const backMat = new THREE.MeshBasicMaterial({
    map: backTex,
    side: THREE.FrontSide
  });
  const backMesh = new THREE.Mesh(geo, backMat);
  backMesh.rotation.y = Math.PI;

  group.add(frontMesh, backMesh);
  group.userData = {
    flipped: false,
    targetRotate: 0,
    currentRotate: 0,
    data: item,
    frontMesh
  }
  const ang = (index / 6) * Math.PI * 2;
  group.position.set(
    diskRadius * Math.cos(ang),
    0,
    diskRadius * Math.sin(ang)
  )

  loadImageToTexture(item.img, function(tex){
    if(tex){
      group.userData.frontMesh.material = new THREE.MeshBasicMaterial({
        map:tex,
        side:THREE.FrontSide
      });
    }
  })
  return group;
}

data.forEach((item, idx) => {
  const card = buildCard(item, idx);
  cardList.push(card);
  disk.add(card);
})

let drag = false, lastX = 0, diskRotY = 0, dragSpeed = 0;

// 只匹配朝代的时候，圆盘转到对应卡片
if(targetCardIndex !== -1){
  const targetAngle = (targetCardIndex / 6) * Math.PI * 2;
  diskRotY = -targetAngle;
  cardList[targetCardIndex].userData.flipped = true;
  cardList[targetCardIndex].userData.targetRotate = Math.PI;
}

function setPointer(e){
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

window.addEventListener("mousedown", e => { drag = true; lastX = e.clientX; })
window.addEventListener("mouseup", () => drag = false)
window.addEventListener("mousemove", e => {
  if (drag) {
    const dx = e.clientX - lastX;
    dragSpeed = dx * 0.004;
    diskRotY += dragSpeed;
    lastX = e.clientX;
  }
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(cardList, true);
  document.body.style.cursor = hit.length ? "pointer" : "default";
})

window.addEventListener("wheel", e => {
  e.preventDefault();
  camera.position.z = THREE.MathUtils.clamp(camera.position.z + e.deltaY * 0.01, 8, 22);
}, { passive: false })

window.addEventListener("click", (e) => {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hitList = raycaster.intersectObjects(cardList, true);
  if (!hitList.length) return;
  const hitObj = hitList[0];
  const card = hitObj.object.parent;
  const ud = card.userData;

  if (ud.flipped) {
    let uvX = hitObj.uv.x;
    let uvY = hitObj.uv.y;
    const px = uvX * 512;
    const py = (1.0 - uvY) * 720;
    for (const p of ud.data.poets) {
      const h = p.hot;
      if (px > h.x1 && px < h.x2 && py > h.y1 && py < h.y2) {
        location.href = p.link;
        return;
      }
    }
  }
  ud.flipped = !ud.flipped;
  ud.targetRotate = ud.flipped ? Math.PI : 0;
})

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
})

function animate() {
  requestAnimationFrame(animate);
  if (!drag) dragSpeed *= 0.94;
  diskRotY += dragSpeed;
  disk.rotation.y = diskRotY;
  cardList.forEach(card => {
    const ud = card.userData;
    ud.currentRotate += (ud.targetRotate - ud.currentRotate) * 0.08;
    card.lookAt(camera.position);
    card.children[0].rotation.y = ud.currentRotate;
    card.children[1].rotation.y = Math.PI + ud.currentRotate;
  })
  renderer.render(scene, camera);
}
animate();
</script>

// 搜索数据源，修正诗人link，诗人跳转XX.html，诗词跳转精选作品
const searchData = [
  // 张养浩

// 模糊筛选，支持匹配name和searchText，诗人优先排在前面
function getSuggestList(keyword){
  if(!keyword.trim()) return [];
  const kw = keyword.trim().toLowerCase();
  const matchAll = searchData.filter(item=> 
    item.name.toLowerCase().includes(kw) || item.searchText.toLowerCase().includes(kw)
  );
  // 诗人优先，诗词其次，朝代放最后
  const poetList = matchAll.filter(i=>i.type==="poet");
  const poemList = matchAll.filter(i=>i.type==="poem");
  const dynastyList = matchAll.filter(i=>i.type==="dynasty");
  return [...poetList,...poemList,...dynastyList];
}

// 渲染联想下拉
function renderSuggest(list){
  if(list.length ===0){
    suggestPanel.innerHTML = `<div class="suggest-empty">无相关结果</div>`;
  }else{
    suggestPanel.innerHTML = list.map(item=>`
      <div class="suggest-item" data-link="${item.link}">
        <span class="icon">🔍</span>
        <span>${item.name}</span>
      </div>
    `).join("");
    document.querySelectorAll(".suggest-item").forEach(el=>{
      el.onclick = ()=>{
        location.href = el.dataset.link;
      }
    })
  }
  suggestPanel.style.display = "block";
}

// 打开弹窗
searchBtn.onclick = function(){
    searchMask.style.display = 'flex';
    searchInput.value = '';
    suggestPanel.style.display="none";
    errTip.innerText = "";
    searchInput.focus();
}
// 关闭弹窗
function closeSearchDialog(){
    searchMask.style.display = 'none';
    suggestPanel.style.display="none";
    errTip.innerText = "";
}
searchCancel.onclick = closeSearchDialog;
// 点击遮罩关闭
searchMask.onclick = function(e){
    if(e.target === searchMask) closeSearchDialog();
}
// 输入监听，实时联想，清空错误提示
searchInput.oninput = function(){
    errTip.innerText = "";
    const kw = this.value;
    if(!kw.trim()){
        suggestPanel.style.display="none";
        return;
    }
    const res = getSuggestList(kw);
    renderSuggest(res);
}
// 执行搜索：先判断有没有匹配，无匹配弹窗提示
function doSearch(){
    let keyword = searchInput.value.trim();
    errTip.innerText = "";
    if(keyword === ""){
        errTip.innerText = "请输入搜索内容";
        return;
    }
    const res = getSuggestList(keyword);
    if(res.length === 0){
        errTip.innerText = "未找到相关诗词、作者或朝代，请更换关键词重试";
        return;
    }
    location.href = `翰墨诗库.html?key=${encodeURIComponent(keyword)}`;
}
searchConfirm.onclick = doSearch;
// 回车直接搜索
searchInput.onkeydown = function(e){
    errTip.innerText = "";
    if(e.key === 'Enter') doSearch();
}

// 读取本地存储的头像
const avatarImg = document.getElementById('avatarImg');
const avatarDefault = document.getElementById('avatarDefault');
const saveAvatar = localStorage.getItem('userAvatar');
if(saveAvatar){
    avatarImg.src = saveAvatar;
    avatarImg.style.display = 'block';
    avatarDefault.style.display = 'none';
}
</script>
